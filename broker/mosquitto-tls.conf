# Qadam broker — TLS profile (deployment). Generate certificates first:
#   python scripts/make_dev_certs.py --ip 192.168.43.10
# then: mosquitto -c broker/mosquitto-tls.conf -v
# Clients: bridge  --tls --cafile certs/ca.pem --mqtt-port 8883
listener 8883 0.0.0.0
cafile certs/ca.pem
certfile certs/server.pem
keyfile certs/server.key
tls_version tlsv1.3
allow_anonymous false
password_file broker/passwd   # create with: mosquitto_passwd -c broker/passwd qadam-bridge
persistence false
